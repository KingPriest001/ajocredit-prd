name: cloudflare
on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
  # The apk workflow publishes the rebuilt APK and the version manifest as a
  # "[skip ci]" commit, and GitHub skips all workflow runs for those - so the mirror
  # would keep serving an older version.json. Re-deploy after the apk workflow.
  workflow_run:
    workflows: ["apk"]
    types: [completed]
  workflow_dispatch:
jobs:
  deploy:
    # Only re-deploy after a successful apk run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (local config excluded)
        run: |
          rm -rf cfdeploy && mkdir -p cfdeploy
          cp -r prototype/* cfdeploy/ && rm -f cfdeploy/ajocredit.apk cfdeploy/config.local.js
          # The APK is NOT copied to the mirror. Cloudflare Pages refuses files over
          # 25 MiB and the APK is now bigger than that (the live-update plugin adds
          # native libraries). Nothing needs it here: the version manifest points at
          # the absolute GitHub Pages and GitHub Releases URLs, and GitHub Pages
          # serves the file fine.
          rm -rf cfdeploy/releases
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cfdeploy --project-name=ajocredit --commit-dirty=true
