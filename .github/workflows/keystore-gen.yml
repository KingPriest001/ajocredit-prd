# ONE-OFF: generate the permanent Android release keystore for Play Store signing.
# Run manually, download the artifact, THEN DELETE THIS WORKFLOW (minting keys
# must never be a permanent CI capability).
name: keystore-gen
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore + random password
        run: |
          PASS=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-20)
          echo "$PASS" > storepass.txt
          keytool -genkeypair -v -keystore ajocredit-release.keystore \
            -alias ajocredit -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=AJOCREDIT, OU=Product, O=Qubators, L=Lagos, ST=Lagos, C=NG"
          keytool -list -v -keystore ajocredit-release.keystore -storepass "$PASS" | grep -E "Alias name|Valid from|Owner"
      - uses: actions/upload-artifact@v4
        with:
          name: ajocredit-release-keystore
          path: |
            ajocredit-release-keystore
            storepass.txt
          retention: 1
