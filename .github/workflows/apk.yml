name: apk
on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown in the app (e.g. 1.0.3). Optional - defaults to the commit SHA."
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # No setup-android: ubuntu-latest runners ship the Android SDK preinstalled (ANDROID_HOME).
      - run: npm init -y
      # @capgo/capacitor-updater 6.7.8 is the newest release that supports
      # Capacitor 6 (peer "@capacitor/core": "^6.0.0") AND builds with the
      # Android toolchain Capacitor 6 ships with (AGP 8.2.1, compileSdk 34).
      # Newer 6.x releases pull in androidx.work 2.10+ / play-services-tasks
      # 18.4.1, which demand compileSdk 35 and AGP 8.6+, and 8.x needs
      # Capacitor 8 altogether.
      - run: npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets @capgo/capacitor-updater@6.7.8
      - run: npx cap init "AJOCREDIT" com.ajocredit.app --web-dir=prototype
      - run: npx cap add android
      - run: mkdir -p resources && cp prototype/icon-1024.png resources/icon.png && cp prototype/icon-1024.png resources/splash.png
      - run: npx capacitor-assets generate --android
      # Write this build's version into the web bundle (bundled into the APK) and
      # publish the same manifest so a running install can compare itself with the
      # newest build and offer an update.
      - name: Write version manifest
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD']).decode().strip()
          version = os.environ.get('APP_VERSION', '').strip() or sha
          # Commit timestamp: monotonic with commit order, identical for every job in
          # this run, and needs no git history (the checkout is shallow).
          code = str(int(subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD']).decode().strip()))
          manifest = {
              'version': version,
              'code': code,
              'built': datetime.datetime.utcnow().isoformat() + 'Z',
              'release': 'https://github.com/KingPriest001/ajocredit-prd/releases/latest',
              'download': 'https://github.com/KingPriest001/ajocredit-prd/releases/latest/download/ajocredit-latest-release.apk',
              'debugDownload': 'https://kingpriest001.github.io/ajocredit-prd/releases/ajocredit.apk',
          }
          pathlib.Path('prototype/version.json').write_text(json.dumps(manifest, indent=1) + '\n')
          pathlib.Path('prototype/version.js').write_text('window.AJO_BUILD=%s;\n' % json.dumps(manifest))
          print('version manifest: ' + json.dumps(manifest))
          PY
      # Tell the app where to look for web-bundle updates. The API decides who gets
      # the update (staged rollout) and can force a rollback to the last good bundle.
      # statsUrl and channelUrl are pointed at our own API so nothing about a
      # member's phone is sent to Capgo's servers.
      # autoUpdate + directUpdate=false: the new bundle is downloaded in the
      # background and installed on the next launch (no splash-screen plugin needed).
      - name: Configure the Capacitor Updater
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('capacitor.config.json')
          cfg = json.loads(p.read_text())
          cfg['plugins'] = cfg.get('plugins', {})
          cfg['plugins']['CapacitorUpdater'] = {
            'updateUrl': 'https://ajocredit-api.onrender.com/api/app/update',
            'statsUrl': 'https://ajocredit-api.onrender.com/api/app/stats',
            'channelUrl': 'https://ajocredit-api.onrender.com/api/app/channel',
            'autoUpdate': True,
            'directUpdate': False,
            'periodCheckDelay': 600,
            'appReadyTimeout': 30000,
            'autoDeleteFailed': True,
            'autoDeletePrevious': True,
            'responseTimeout': 20,
          }
          p.write_text(json.dumps(cfg, indent=2) + '\n')
          print('capacitor updater configured')
          PY
      - run: rm -f releases/ajocredit.apk && mkdir -p releases
      - run: npx cap sync
      # Android only accepts an update whose versionCode is HIGHER than the installed
      # one. `npx cap init` generates versionCode 1, so without this every build has the
      # same code: a new APK is rejected and the member has to uninstall first (losing
      # their local session). The commit count always increases, so each build upgrades
      # cleanly over the last one.
      - name: Set versionCode / versionName
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib, subprocess, time
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          # Epoch seconds: always increases, and does not depend on git history
          # (actions/checkout is a shallow clone, so a commit count would always
          # read 1). Fits Android's 2,100,000,000 versionCode ceiling until 2036.
          count = int(time.time())
          sha = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD']).decode().strip()
          version = os.environ.get('APP_VERSION', '').strip() or sha
          s = re.sub(r'versionCode\s+\d+', 'versionCode %d' % count, s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "%s"' % version, s, count=1)
          p.write_text(s)
          print('versionCode=%s versionName=%s' % (count, version))
          for line in s.splitlines():
              if 'versionCode' in line or 'versionName' in line:
                  print('build.gradle now has: ' + line.strip())
          PY
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ajocredit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk releases/ajocredit.apk
      # Publish the web bundle (a zip of the web assets) plus its manifest, so an
      # installed app can pull a new build WITHOUT a new APK. The manifest keeps the
      # previous bundle, so a rollback is one env var away on the API.
      - name: Publish web bundle
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path('prototype')
          version = os.environ.get('APP_VERSION', '').strip() or subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD']).decode().strip()
          bundles = root / 'bundles'
          bundles.mkdir(exist_ok=True)
          zpath = bundles / (version + '.zip')
          with zipfile.ZipFile(zpath, 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(root.rglob('*')):
                  if f.is_dir():
                      continue
                  rel = f.relative_to(root).as_posix()
                  if rel.split('/')[0] == 'bundles' or f.name == 'ajocredit.apk':
                      continue
                  z.write(f, rel)
          sha = hashlib.sha256(zpath.read_bytes()).hexdigest()
          base = 'https://kingpriest001.github.io/ajocredit-prd/bundles/'
          mp = root / 'bundle.json'
          prev = {}
          if mp.exists():
              try:
                  prev = json.loads(mp.read_text())
              except Exception:
                  prev = {}
          out = {'version': version, 'url': base + version + '.zip', 'sha256': sha}
          if prev.get('version') and prev.get('url'):
              out['rollback'] = {'version': prev['version'], 'url': prev['url'], 'sha256': prev.get('sha256', '')}
          mp.write_text(json.dumps(out, indent=1) + '\n')
          print('bundle published: %s %s sha256=%s' % (out['version'], out['url'], sha[:16]))
          PY
      - run: |
          git config user.name "ajocredit-ci"
          git config user.email "ci@ajocredit.ng"
          git add releases/ajocredit.apk prototype/version.json prototype/version.js prototype/bundle.json prototype/bundles
          git diff --staged --quiet || (git commit -m "[skip ci] Refresh published APK" && git push)

  # ---- Play Store–ready release signing (does NOT publish; artifacts only) ----
  # Signs a release AAB + APK with the permanent keystore stored in repo secrets.
  # The debug job above keeps publishing prototype/ajocredit.apk unchanged, so
  # existing debug installs are unaffected. Upload to Play Console is a manual,
  # separate step whenever you choose.
  release:
    name: release-signed (aab + apk, not published)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm init -y
      # @capgo/capacitor-updater 6.7.8 is the newest release that supports
      # Capacitor 6 (peer "@capacitor/core": "^6.0.0") AND builds with the
      # Android toolchain Capacitor 6 ships with (AGP 8.2.1, compileSdk 34).
      # Newer 6.x releases pull in androidx.work 2.10+ / play-services-tasks
      # 18.4.1, which demand compileSdk 35 and AGP 8.6+, and 8.x needs
      # Capacitor 8 altogether.
      - run: npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets @capgo/capacitor-updater@6.7.8
      - run: npx cap init "AJOCREDIT" com.ajocredit.app --web-dir=prototype
      - run: npx cap add android
      - run: mkdir -p resources && cp prototype/icon-1024.png resources/icon.png && cp prototype/icon-1024.png resources/splash.png
      - run: npx capacitor-assets generate --android
      # Same version manifest as the debug job - identical values (the commit
      # timestamp), so the release APK and the published web build agree.
      - name: Write version manifest
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD']).decode().strip()
          version = os.environ.get('APP_VERSION', '').strip() or sha
          code = str(int(subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD']).decode().strip()))
          manifest = {
              'version': version,
              'code': code,
              'built': datetime.datetime.utcnow().isoformat() + 'Z',
              'release': 'https://github.com/KingPriest001/ajocredit-prd/releases/latest',
              'download': 'https://github.com/KingPriest001/ajocredit-prd/releases/latest/download/ajocredit-latest-release.apk',
              'debugDownload': 'https://kingpriest001.github.io/ajocredit-prd/releases/ajocredit.apk',
          }
          pathlib.Path('prototype/version.json').write_text(json.dumps(manifest, indent=1) + '\n')
          pathlib.Path('prototype/version.js').write_text('window.AJO_BUILD=%s;\n' % json.dumps(manifest))
          print('version manifest: ' + json.dumps(manifest))
          PY
      # Same updater configuration as the debug job.
      - name: Configure the Capacitor Updater
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('capacitor.config.json')
          cfg = json.loads(p.read_text())
          cfg['plugins'] = cfg.get('plugins', {})
          cfg['plugins']['CapacitorUpdater'] = {
            'updateUrl': 'https://ajocredit-api.onrender.com/api/app/update',
            'statsUrl': 'https://ajocredit-api.onrender.com/api/app/stats',
            'channelUrl': 'https://ajocredit-api.onrender.com/api/app/channel',
            'autoUpdate': True,
            'directUpdate': False,
            'periodCheckDelay': 600,
            'appReadyTimeout': 30000,
            'autoDeleteFailed': True,
            'autoDeletePrevious': True,
            'responseTimeout': 20,
          }
          p.write_text(json.dumps(cfg, indent=2) + '\n')
          print('capacitor updater configured')
          PY
      - run: npx cap sync
      # Same versionCode rule as the debug job - see the comment there. Without this
      # every release APK is versionCode 1 and no member could ever update in place.
      - name: Set versionCode / versionName
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib, subprocess, time
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          # Epoch seconds: always increases, and does not depend on git history
          # (actions/checkout is a shallow clone, so a commit count would always
          # read 1). Fits Android's 2,100,000,000 versionCode ceiling until 2036.
          count = int(time.time())
          sha = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD']).decode().strip()
          version = os.environ.get('APP_VERSION', '').strip() or sha
          s = re.sub(r'versionCode\s+\d+', 'versionCode %d' % count, s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "%s"' % version, s, count=1)
          p.write_text(s)
          print('versionCode=%s versionName=%s' % (count, version))
          for line in s.splitlines():
              if 'versionCode' in line or 'versionName' in line:
                  print('build.gradle now has: ' + line.strip())
          PY
      # Materialize the keystore from the base64 secret.
      - name: Write keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
      # Wire a release signingConfig into the generated Gradle project via key.properties.
      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          # Insert signingConfigs block if the template doesn't already define one we can reuse.
          if 'signingConfigs' not in s:
              block = '''
              signingConfigs {
                  release {
                      storeFile rootProject.file("app/upload-keystore.jks")
                      storePassword RELEASE_STORE_PASSWORD
                      keyAlias RELEASE_KEY_ALIAS
                      keyPassword RELEASE_KEY_PASSWORD
                  }
              }
              '''
              s = s.replace('android {', 'android {\n' + block, 1)
          # Point the release buildType at the release config.
          s = re.sub(r'buildTypes\s*\{[\s\S]*?release\s*\{', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', s, count=1)
          # Provide the properties from key.properties.
          inject = '''
          def keystoreProps = new Properties()
          def keystorePropsFile = rootProject.file("key.properties")
          if (keystorePropsFile.exists()) {
              keystoreProps.load(new FileInputStream(keystorePropsFile))
              project.ext.RELEASE_STORE_PASSWORD = keystoreProps.getProperty("storePassword")
              project.ext.RELEASE_KEY_ALIAS = keystoreProps.getProperty("keyAlias")
              project.ext.RELEASE_KEY_PASSWORD = keystoreProps.getProperty("keyPassword")
          }
          '''
          s = inject + s
          p.write_text(s)
          print("build.gradle patched for release signing")
          PY
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease
      # Prove the APK is validly signed with our key (this is the "Play Store–ready" check).
      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee /tmp/certs.txt
          grep -qi "CN=AJOCREDIT" /tmp/certs.txt && echo "SIGNER-OK: CN=AJOCREDIT" || (echo "SIGNER-FAIL: unexpected signer"; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: ajocredit-release-signed
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
