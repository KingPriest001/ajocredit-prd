name: apk
on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # No setup-android: ubuntu-latest runners ship the Android SDK preinstalled (ANDROID_HOME).
      - run: npm init -y
      - run: npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
      - run: npx cap init "AJOCREDIT" com.ajocredit.app --web-dir=prototype
      - run: npx cap add android
      - run: mkdir -p resources && cp prototype/icon-1024.png resources/icon.png && cp prototype/icon-1024.png resources/splash.png
      - run: npx capacitor-assets generate --android
      - run: npx cap sync
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ajocredit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk prototype/ajocredit.apk
      - run: |
          git config user.name "ajocredit-ci"
          git config user.email "ci@ajocredit.ng"
          git add prototype/ajocredit.apk
          git diff --staged --quiet || (git commit -m "[skip ci] Refresh published APK" && git push)
